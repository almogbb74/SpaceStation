org.gradle.jvmargs=-Xmx2048m
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false

# Both required together: the standalone kotlin-android Gradle plugin (as opposed to AGP's
# newer built-in Kotlin support) still calls the pre-AGP-9 variant API internally, so newDsl
# has to stay off for it to keep working. Migrating off both is a real structural change
# (dropping the separate Kotlin/Android plugin), not a one-line flip - not doing that here.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
